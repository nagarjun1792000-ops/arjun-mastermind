name: arjun_mastermind
description: Arjun Mastermind - Namma Ooru All-in-One Super App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mobile_ads: ^3.1.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_final.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo_final.png"
    background_color: "#0A194E"
    theme_color: "#0A194E"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo_final.png
