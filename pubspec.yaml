name: arjun_mastermind
description: Namma Ooru Super App - All in One
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_mobile_ads: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_final.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo_final.png"
  min_sdk_android: 21
  web:
    generate: false
