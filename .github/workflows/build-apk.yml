name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Generate Android folder
        run: flutter create . --platforms=android --project-name arjun_mastermind
      
      - name: Fix Android Desugaring for flutter_local_notifications
        run: |
          FILE="android/app/build.gradle"
          if [ ! -f "$FILE" ]; then
            FILE="android/app/build.gradle.kts"
          fi
          echo "Patching $FILE..."
          # Add desugar lib dependency if not present
          if ! grep -q "desugar_jdk_libs" "$FILE"; then
            sed -i '/^dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$FILE"
            # For kts file syntax is slightly different but this works for both with gradle parser fallback
            if grep -q "\.kts" <<< "$FILE"; then
              sed -i 's/coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")/coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")/' "$FILE"
            fi
          fi
          # Enable coreLibraryDesugaringEnabled
          if ! grep -q "isCoreLibraryDesugaringEnabled" "$FILE"; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' "$FILE"
          fi
          cat "$FILE"
      
      - name: Copy or Create google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
            echo "Firebase config copied!"
          else
            echo "Creating dummy google-services.json for build..."
            mkdir -p android/app
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "arjun-mastermind-dummy",
              "storage_bucket": "arjun-mastermind-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.arjun_mastermind"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey-0000000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
