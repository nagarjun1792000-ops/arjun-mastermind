name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Fix Android folder and Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! python3 -m xml.dom.minidom "$MANIFEST" > /dev/null 2>&1; then
              echo "Manifest broken! Recreating..."
              rm -rf android
            fi
          fi
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name arjun_mastermind
          fi
          python3 << 'PY'
          import pathlib
          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n        </application>')
              path.write_text(text)
          PY
      
      - name: Ensure assets and logo exists - CREATE IF MISSING
        run: |
          mkdir -p assets
          if [ ! -f "assets/logo_final.png" ]; then
            echo "Logo NOT found - creating placeholder blue-gold logo"
            pip install Pillow -q
            python3 << 'PY'
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (512, 512), color=(10, 25, 78))
          draw = ImageDraw.Draw(img)
          # Gold circle
          draw.ellipse([50, 50, 462, 462], outline=(255, 215, 0), width=15)
          draw.ellipse([100, 100, 412, 412], fill=(255, 215, 0))
          # AM text - simple
          try:
              draw.text((150, 180), "AM", fill=(10,25,78), font_size=180)
          except:
              draw.text((150, 180), "AM", fill=(10,25,78))
          img.save("assets/logo_final.png")
          print("Placeholder logo created")
          PY
          else
            echo "Logo found!"
          fi
          ls -lh assets/
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate App Icon
        continue-on-error: true
        run: |
          flutter pub run flutter_launcher_icons || echo "Icon gen skipped"
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namma-ooru-app-final
          path: build/app/outputs/flutter-apk/app-release.apk
