name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Fix Android folder and Manifest
        run: |
          # Manifest odanja iruntha android folder ah delete panni pudhusa create pannum
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! python3 -m xml.dom.minidom "$MANIFEST" > /dev/null 2>&1; then
              echo "Manifest broken! Recreating..."
              rm -rf android
            fi
          fi
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name arjun_mastermind
          fi
          # AdMob ID ah correct ah insert pannum python la
          python3 << 'PY'
          import pathlib
          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n        </application>')
              path.write_text(text)
              print("AdMob ID added safely")
          else:
              print("AdMob ID already exists")
          PY
          cat "$MANIFEST"
      
      - name: Ensure assets folder exists
        run: |
          mkdir -p assets
          if [ -f "assets/logo_final.png" ]; then
            echo "Logo exists - OK"
            ls -lh assets/logo_final.png
          else
            echo "Logo missing - will use default icon"
          fi
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Generate App Icon
        continue-on-error: true
        run: |
          if [ -f "assets/logo_final.png" ]; then
            flutter pub run flutter_launcher_icons || echo "Icon generation skipped"
          else
            echo "No logo, skipping icon generation"
          fi
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namma-ooru-app-final
          path: build/app/outputs/flutter-apk/app-release.apk
